# MATSim Input
matsim_output_dir: data/matsim_output
plans_file: output_plans.xml.gz
experienced_plans_file: output_experienced_plans.xml.gz
trips_file: output_trips.csv.gz
legs_file: output_legs.csv.gz
events_file: output_events.xml.gz
network_file: output_network.xml.gz
links_file: output_links.csv.gz

# Filtering Settings
modes_keep:
  - car
  - truck
keep_pass_through: true
scale_factor: 10.0
dep_time_jitter_seconds: 1800 # 30 minutes
coord_jitter_radius_m: 500.0
demand_scaling_seed: 42
boundary_file: data/boundaries/vmod_boundary.geojson

# Output
output_dir: results/run_03_transcality_network
write_intermediates: false
write_review_csv: true

# Step 8 SUMO edge matching
match_sumo_edges_script: scripts/match_scaled_trips_sumo_edges_macOS.sh
sumo_network_path: data/sumo_scenario/Zurich_Scenario_Transcality/VMOD.net.xml
sumo_match_vehicle_col: mode
sumo_match_radius_m: 150.0
sumo_match_max_radius_m: 2000.0
sumo_match_assume_xy: false
sumo_match_cache_round_m: 1.0
sumo_vclass_map:
  car: passenger
  truck: truck
