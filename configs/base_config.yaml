# MATSim Input
matsim_output_dir: data/DMC_Parameter_Urban_2/calibrated_mode_parameters_1
plans_file: output_plans.xml.gz
trips_file: output_trips.csv.gz
events_file: output_events.xml.gz
network_file: output_network.xml.gz

# Filtering Settings
modes_keep:
  - car
  - truck
scale_factor: 10.0
dep_time_jitter_seconds: 3600 # 60 minutes
coord_jitter_radius_m: 500.0
demand_scaling_seed: 31
boundary_file: data/boundaries/sumo_boundary_transcality.geojson

# Output
output_dir: results/run_20_MATSim_Scenario_2_urbancore_-2
write_intermediates: false
write_review_csv: false

# Step 7 amenity-based coordinate jitter
amenity_kdtree_enabled: true
amenities_path: data/Amenities_Location/locations.csv
amenities_sep: ","
amenities_x_col: x
amenities_y_col: y
amenities_weight_col: weight

# Step 8 SUMO edge matching
sumo_network_path: data/sumo_scenario/Zurich_Scenario_Transcality/VMOD.net.xml
sumo_network_lv95_tmp_file: data/tmp/0_sumo_osm_network_lv95.geojson
sumo_vclass_map:
  car: passenger
  truck: truck

# Step 10 duarouter
duarouter_bin: /Users/Matteo/Documents/0_ETH/0_Master_Thesis/2_SUMO_Simulation/sumo-env/bin/duarouter
sumo_routes_file: 10_sumo_routes.rou.xml
sumo_unrouted_trips_file: 10_unrouted_trips.xml
duarouter_log_file: 10_duarouter.log
