# Travel-time analysis config.
# Set the actual API token in the environment as TOMTOM_API_KEY.

# TomTom
tomtom_api_key_env: TOMTOM_API_KEY
tomtom_daily_request_limit: 5000
tomtom_save_every: 50
tomtom_request_delay_s: 0.1

# Random trips
min_trip_distance_km: 0.5
travel_time_analysis_dir: .
travel_time_random_trips_file: 1_output_scenario_bahnhof/random_trips_5000_bahnhof_tight5.csv
travel_time_random_trip_count: 5000
travel_time_departure_start_s: 18000
travel_time_departure_end_s: 79200
travel_time_random_seed: 31
travel_time_boundary_file: data/boundaries/zurich_bahnhof_boundary_tight5.geojson
travel_time_sumo_vclass: passenger

# MATSim
matsim_output_dir: data/matsim_output_50pct

# SUMO
sumo_output_dir: /Users/Matteo/Documents/0_ETH/0_Master_Thesis/2_SUMO_Simulation/sumo-env/scenarios/sumo_scenario_euler/output_micro_zuerich_bahnhof/20260609_152136_hourly_100pct

# SUMO simulation options
sumo_background_mode: hourly_load_state
sumo_random_depart_offset_s: 0
sumo_completion_buffer_s: 7200
sumo_simulation_begin_s: 18000
sumo_simulation_end_s: 86400
